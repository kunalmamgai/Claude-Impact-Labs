services:
  - type: web
    name: bhashahire-backend
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm run backend
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.13.0
      - key: SNAPSHOT_DIR
        value: ./data/snapshots
      - key: FRONTEND_ORIGIN
        value: https://bhashahire.vercel.app
      - key: ADMIN_API_KEY
        generateValue: true
      - key: LLM_API_KEY
        sync: false
      - key: LLM_BASE_URL
        sync: false
      - key: LLM_MODEL
        sync: false
